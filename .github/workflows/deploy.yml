name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-portfolio
            git pull origin main
            docker build -t devops-portfolio .
            docker rm -f portfolio || true
            docker run -d \
              --name portfolio \
              -p 8080:80 \
              devops-portfolio
